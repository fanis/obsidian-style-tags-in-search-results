name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from manifest.json
        id: ver
        run: echo "version=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ver.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.ver.outputs.version }} already exists; skipping build + release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'false'
        with:
          node-version: "20"

      - name: Install dev dependencies
        if: steps.check.outputs.exists == 'false'
        run: npm ci

      - name: Lint
        if: steps.check.outputs.exists == 'false'
        run: npm run lint

      - name: Run tests
        if: steps.check.outputs.exists == 'false'
        run: npm test

      - name: Attest build provenance
        if: steps.check.outputs.exists == 'false'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Extract release notes from CHANGELOG.md
        if: steps.check.outputs.exists == 'false'
        id: notes
        run: |
          version="${{ steps.ver.outputs.version }}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/        { exit }
            found                    { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No CHANGELOG.md section found for [$version]; will fall back to --generate-notes."
          fi

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.ver.outputs.version }}"
          if [ "${{ steps.notes.outputs.found }}" = "true" ]; then
            gh release create "$version" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$version" \
              --notes-file release-notes.md \
              main.js manifest.json styles.css
          else
            gh release create "$version" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$version" \
              --generate-notes \
              main.js manifest.json styles.css
          fi
